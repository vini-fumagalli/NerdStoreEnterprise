apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --controller deployment -f nerdstore_producao.yml -o k8s/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: sql-server
  name: sql-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: sql-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --controller deployment -f nerdstore_producao.yml -o k8s/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: sql-server
    spec:
      containers:
        - env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SA_PASSWORD
              value: MeuDB@123
          image: tcc/nerdstore-sql-server:latest
          name: nerdstore-sql-server
          ports:
            - containerPort: 1433
              protocol: TCP
      restartPolicy: Always
