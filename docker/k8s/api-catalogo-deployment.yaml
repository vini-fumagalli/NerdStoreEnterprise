apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --controller deployment -f nerdstore_producao.yml -o k8s/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: api-catalogo
  name: api-catalogo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api-catalogo
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --controller deployment -f nerdstore_producao.yml -o k8s/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: api-catalogo
    spec:
      containers:
        - env:
            - name: ASPNETCORE_ENVIROMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://*:5301
          image: tcc/nerdstore-api-catalogo:latest
          name: nerdstore-api-catalogo
          ports:
            - containerPort: 5301
              protocol: TCP
      restartPolicy: Always
