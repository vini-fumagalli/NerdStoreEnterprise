apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --controller deployment -f nerdstore_producao.yml -o k8s/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: api-cliente
  name: api-cliente
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api-cliente
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --controller deployment -f nerdstore_producao.yml -o k8s/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: api-cliente
    spec:
      containers:
        - env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5401
          image: tcc/nerdstore-api-cliente:latest
          name: nerdstore-api-cliente
          ports:
            - containerPort: 5401
              protocol: TCP
      restartPolicy: Always
